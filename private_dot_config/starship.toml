format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$all\
$line_break\
$character"""

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = " [$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = " [$duration]($style) "
style = "yellow"

[python]
format = ' [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style) '
style = "bright-black"

# Remove prose separators from contextual modules.
[bun]
format = " [$symbol($version )]($style)"

[c]
format = " [$symbol($version(-$name) )]($style)"

[cmake]
format = " [$symbol($version )]($style)"

[cobol]
format = " [$symbol($version )]($style)"

